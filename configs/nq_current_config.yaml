# Frozen current configuration for the NQ strict one-position, time-aware-SAL
# engine. Every value the engine relies on appears explicitly here. The
# engine's hardcoded constants (src/strict_engine.py, src/level_generation.py)
# must match every value in this file -- see tests/test_strategy_invariants.py
# and tests/test_data.py, which assert this directly rather than trusting it.
#
# Changing any value here invalidates the frozen_result numbers below and
# requires a fresh verification run before being trusted again. No grid
# search or parameter optimization has been authorized -- see README.md.

data:
  bars_file: data/nq_1m/nq_continuous_2018_2026_1m.csv
  bars_sha256: 3d0228fcc17a40933d4fdc3983a8153e5bb6445ed9e743919b3eb5c516e53880
  bars_rows: 2964655
  vxn_file: data/vxn_daily_2018_2026.csv
  vxn_sha256: 76cc072c941542183d8c82174fe4f552b0f140f9cb368c302ad51f651992dc4e
  timezone: America/New_York

level_generation:
  rth_start: "09:30"
  rth_end: "16:00"
  ib_minutes: 60
  sigma_mult: 1.25
  offset_pct: 0.07          # unused for NQ (fixed_offset takes precedence)
  fixed_offset: 15.75
  annual_trading_days: 252
  line_days: 20

candidate_gate:
  # The static gates every downstream engine shares: first touch exists,
  # valid entry time, prior completed 1h range exists, valid session
  # cutoff, nonempty post-entry path.
  eligible_count: 1841

level_rule:
  line_days: 20
  description: >
    Each level side (upper/lower) lives from its created_at bar until the
    twentieth newer level is created. It has at most one physical first
    touch, ever. A touch permanently consumes the side, whether or not a
    trade is actually entered on it (blocked time, no anchor, SAL active,
    position open, and simultaneous-touch collisions all consume the side
    without a later retry).

position:
  mode: single_global
  description: exactly one active NQ position at a time, across the whole book.

entry_window:
  valid: "19:00 ET through 11:00 ET"
  blocked: "11:00 ET through 19:00 ET"

session_cutoff: "15:00 ET"

sal:
  enabled: true
  activation: >
    Arms only at the actual exit timestamp of a realized negative trade
    (pnl < 0 and exit_reason != BE). Never arms retroactively from entry
    time, and never arms on a 0pt BE scratch. A negative cutoff exit does
    arm SAL.
  reset: "next 19:00 ET -> 15:00 ET session"

risk:
  anchor_interval_minutes: 60
  anchor: "previous completed 60-minute high-low range at physical-touch time"
  range_multiplier: 1.5
  stop_cap: 200
  stop_distance: "min(1.5 * anchor, 200)"
  reward_to_risk: 1.0
  target_distance: stop_distance
  conditional_be:
    enabled: true
    bar: 45
    rule: >
      At bar 45 (0-indexed bars after the touch bar), check the open of
      that bar against entry. If on the profit side, arm BE (stop moves
      to entry). If not, the original stop remains for the rest of the
      trade.

edge_cases:
  creation_bar_entry: excluded   # no entry on the level's own creation bar
  expiry_timestamp: excluded     # expiry bar itself excluded from touch search
  touch_bar_resolution: stop_first  # touch bar only checked for stop; a
                                      # target hit on the touch bar is never
                                      # assumed a win without causal ordering
  gap_through_fill: deterministic_realistic_fill  # touch-bar close used
                                                    # when the level itself
                                                    # isn't inside the bar's
                                                    # high-low range. This is
                                                    # NOT a worst-case
                                                    # assumption -- it can
                                                    # help or hurt PnL
                                                    # depending on direction.
  same_bar_reentry: blocked      # no new entry on the bar the active
                                  #    trade exits
  simultaneous_touch_ordering: oldest_level_first  # deterministic level-age ordering

costs:
  headline_result_cost_pts: 0.0
  also_reported: [0.5, 1.0, 2.0]
  applies_to: [TP, SL, BE, cutoff]

frozen_result:
