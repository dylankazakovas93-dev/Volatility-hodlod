  # difference: running the frozen src/strict_engine.py against the
  # reconstructed file reproduces the pre-existing, already-committed
  # canonical outputs/baseline_executed.csv BYTE-FOR-BYTE
  # (sha256 b9419b1be06310a179ec7c7fb05f6c4a4189ab9951ebfe3f5e42be19f4a0e56a
  # for both). Both hashes are recorded here for full transparency.
  bars_sha256_manifest: 3d0228fcc17a40933d4fdc3983a8153e5bb6445ed9e743919b3eb5c516e53880
  bars_sha256_reconstructed_verified_harmless: 9f427eb053b6c63e50f79baf666f239f851558d1558e706fc126cbe69f3a5af4
  vxn_file: data/vxn_daily_2018_2026.csv
  vxn_sha256: 76cc072c941542183d8c82174fe4f552b0f140f9cb368c302ad51f651992dc4e
  timezone: America/New_York

# --- Level generation / stop-calc / core engine mechanics (unchanged) -------
level_generation:
  source: canonical_unchanged   # src/strict_engine.py — not modified anywhere in this research line
  rth_start: "09:30"
  rth_end: "16:00"
  ib_minutes: 60
  sigma_mult: 1.25
  fixed_offset: 15.75    # NQ; offset_pct (0.07) unused, fixed_offset takes precedence
  annual_trading_days: 252
  line_days: 20
  candidate_gate_eligible_count: 1841

stop_calc:
  cap_formula: "min(1.5 * anchor, SL_CAP)"   # unchanged; only the target moves in this research line
  sl_cap: SL_CAP   # canonical constant from src/strict_engine.py, unchanged

# --- Position / touch mechanics (unchanged) ---------------------------------
one_global_position: true
no_overlap: true
no_stacking: true
no_same_minute_reentry: true
permanent_touch_consumption: true   # a blocked/consumed touch is never retried
tie_order: age   # oldest-level-first on simultaneous touches (canonical default)
intrabar_ambiguity: conservative   # conservative TP/SL ambiguity handling, unchanged from strict_engine.py

# --- Session / time rules (unchanged) ---------------------------------------
forced_liquidation_time_et: "15:00"   # session_cutoff(), unchanged
prop_hard_blackout:
  start_et: "16:00"    # inclusive
  end_et: "19:00"       # exclusive
  configurable: false   # hard-coded in src/og_build_variant_engine.py::in_prop_hard_blackout, always on, structurally independent of entry_blackout below

entry_blackout:
  name: RESEARCH_ENTRY_BLACKOUT_10_15
  blocked_window_et: ["10:00", "15:00"]   # entries blocked 10:00 ET through 15:00 ET cutoff
  blocked_window_minutes: [600, 900]
  note: >
    Blocked ENTRY interval (not an "allowed trading window"). Independent
    of, and checked after, PROP_HARD_BLACKOUT.

# --- Management: BE45, no extra lock, no HMM, SAL off -----------------------
sal_enabled: false
management:
  mode: barcount
  be_bars: 45
  be_extra_lock: 0.0   # no additional lock beyond exact breakeven
hmm_gate:
  enabled: false

# --- The one axis that differs from OG_OPERATIONAL_100R ---------------------
target:
  target_r: 1.50
  lane: "B"
  note: >
    target_dist = target_r * cap. The stop distance/cap itself is never
    changed by this parameter; only the target moves. This is the sole
    parameter difference between OG_PRIMARY_150R and OG_OPERATIONAL_100R.

# --- Data firewall reminder --------------------------------------------------
data_firewall:
  og_build_years: [2018, 2020, 2023, 2026]
  build_2026_scope: "partial, through 2026-06-07"
  excluded_years_never_used_for_outcomes: [2019, 2021, 2022, 2024, 2025]

